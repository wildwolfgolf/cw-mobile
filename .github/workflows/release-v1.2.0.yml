name: Publish CW Mobile 1.2.0

on:
  push:
    branches: [main]
    paths: [downloads/CW_Mobile-1.2.0.apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish-cw-mobile-v1.2.0

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify APK checksum
        working-directory: downloads
        run: sha256sum -c CW_Mobile-1.2.0.apk.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists."
          else
            gh release create v1.2.0 downloads/CW_Mobile-1.2.0.apk downloads/CW_Mobile-1.2.0.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CW Mobile 1.2.0" \
              --notes-file downloads/v1.2.0.md
          fi
