plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'org.cwmobile'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'org.cwmobile'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
